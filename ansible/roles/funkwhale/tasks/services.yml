---
# Units come from config/systemd so manual and Ansible installs share one copy
- name: Deploy systemd units
  copy:
    content: "{{ lookup('file', role_path ~ '/../../../config/systemd/' ~ item) | replace('/srv/funkwhale', funkwhale_dir) }}\n"
    dest: "/etc/systemd/system/{{ item }}"
  loop:
    - funkwhale.target
    - funkwhale-server.service
    - funkwhale-worker.service
    - funkwhale-beat.service
  notify:
    - reload systemd
    - restart funkwhale

- name: Reload systemd
  systemd:
    daemon_reload: yes

- name: Enable and start Funkwhale
  systemd:
    name: funkwhale.target
    state: started
    enabled: yes

- name: Ensure nginx is running
  systemd:
    name: nginx
    state: started
    enabled: yes
